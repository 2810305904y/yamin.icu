      <stop offset="0.58" stop-color="#adbac9" stop-opacity="0.16" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="2800" height="900" fill="none" />

  <g mask="url(#edge-fade)">
