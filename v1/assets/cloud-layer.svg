<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="900" viewBox="0 0 2800 900">
  <defs>
    <linearGradient id="edge-fade-gradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0" />
      <stop offset="0.14" stop-color="#000000" stop-opacity="0" />
      <stop offset="0.24" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="0.76" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="0.88" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <mask id="edge-fade">
      <rect width="2800" height="900" fill="url(#edge-fade-gradient)" />
    </mask>
    <radialGradient id="cloud-white" cx="46%" cy="42%" r="66%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="0.46" stop-color="#f7fbff" stop-opacity="0.72" />
      <stop offset="0.72" stop-color="#e2eaf4" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cloud-bright" cx="43%" cy="38%" r="64%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.58" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cloud-shadow" cx="50%" cy="62%" r="74%">
