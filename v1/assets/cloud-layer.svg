<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="cloud-warp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.028" numOctaves="5" seed="21" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="46" xChannelSelector="R" yChannelSelector="G" />
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="cloud-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <radialGradient id="cloud-white" cx="45%" cy="42%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="0.52" stop-color="#f5f9ff" stop-opacity="0.86" />
      <stop offset="0.78" stop-color="#d8e2ef" stop-opacity="0.38" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cloud-shadow" cx="48%" cy="58%" r="70%">
      <stop offset="0" stop-color="#74869c" stop-opacity="0.38" />
      <stop offset="0.58" stop-color="#9cabbd" stop-opacity="0.26" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="none" />

  <g filter="url(#cloud-soft)" opacity="0.36">
    <ellipse cx="310" cy="230" rx="310" ry="135" fill="url(#cloud-shadow)" />
    <ellipse cx="830" cy="150" rx="440" ry="180" fill="url(#cloud-shadow)" />
    <ellipse cx="1260" cy="250" rx="350" ry="145" fill="url(#cloud-shadow)" />
    <ellipse cx="560" cy="530" rx="420" ry="155" fill="url(#cloud-shadow)" />
    <ellipse cx="1130" cy="585" rx="500" ry="165" fill="url(#cloud-shadow)" />
  </g>

  <g filter="url(#cloud-warp)" opacity="0.92">
    <ellipse cx="120" cy="275" rx="180" ry="92" fill="url(#cloud-white)" />
    <ellipse cx="285" cy="220" rx="260" ry="128" fill="url(#cloud-white)" />
    <ellipse cx="500" cy="255" rx="245" ry="118" fill="url(#cloud-white)" />
    <ellipse cx="760" cy="170" rx="310" ry="150" fill="url(#cloud-white)" />
    <ellipse cx="1020" cy="205" rx="335" ry="138" fill="url(#cloud-white)" />
    <ellipse cx="1320" cy="255" rx="295" ry="132" fill="url(#cloud-white)" />
    <ellipse cx="1535" cy="190" rx="205" ry="102" fill="url(#cloud-white)" />
  </g>

  <g filter="url(#cloud-warp)" opacity="0.74">
    <ellipse cx="180" cy="610" rx="230" ry="108" fill="url(#cloud-white)" />
    <ellipse cx="430" cy="545" rx="315" ry="140" fill="url(#cloud-white)" />
    <ellipse cx="720" cy="600" rx="285" ry="128" fill="url(#cloud-white)" />
    <ellipse cx="1010" cy="552" rx="365" ry="148" fill="url(#cloud-white)" />
    <ellipse cx="1340" cy="620" rx="300" ry="126" fill="url(#cloud-white)" />
  </g>

  <g filter="url(#cloud-soft)" opacity="0.42">
    <ellipse cx="640" cy="338" rx="360" ry="75" fill="#eef5ff" />
    <ellipse cx="1180" cy="386" rx="410" ry="82" fill="#edf5ff" />
    <ellipse cx="230" cy="430" rx="320" ry="66" fill="#f8fbff" />
  </g>
</svg>
