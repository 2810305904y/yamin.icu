<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>鸦珉.icu - 内容编辑台</title>
    <link rel="stylesheet" href="/v1/styles.css" />
    <link rel="stylesheet" href="/admin/styles.css?v=1.4.4-admin-revision" />
    <script type="module" src="/admin/admin.mjs?v=1.4.4-admin-revision"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <header class="admin-topbar">
        <div>
          <p class="admin-kicker">V1.5.3</p>
          <h1>内容编辑台</h1>
        </div>
        <div class="admin-actions" aria-label="全局操作">
          <a class="button-link ghost-button" href="/" target="_blank" rel="noreferrer" data-action="view-home">查看主页</a>
          <button type="button" data-action="save-draft">保存草稿</button>
          <button type="button" data-action="save-online">保存到线上</button>
          <button type="button" data-action="download">下载数据文件</button>
          <button type="button" class="ghost-button" data-action="reset-draft">恢复线上内容</button>
          <button type="button" class="ghost-button subtle-button" data-action="clear-session">清除此设备授权</button>
        </div>
      </header>

      <section class="admin-status" data-status>正在加载当前内容。</section>

      <dialog class="auth-dialog" data-auth-dialog>
        <form class="auth-card" data-auth-form>
          <h2>后台授权</h2>
          <p>输入后台口令后会继续保存，当前草稿不会丢。</p>
          <label class="field">
            <span>后台口令</span>
            <input type="password" autocomplete="current-password" data-auth-password />
          </label>
          <label class="auth-trust">
            <input type="checkbox" data-auth-trust />
            <span>信任这台设备</span>
          </label>
          <p class="auth-message" data-auth-message></p>
          <div class="auth-actions">
            <button type="button" class="ghost-button" data-auth-cancel>取消</button>
            <button type="submit" data-auth-submit>继续保存</button>
          </div>
        </form>
      </dialog>

      <section class="admin-workbench">
        <aside class="admin-sidebar" aria-label="编辑分区">
          <nav class="admin-tabs" data-tabs></nav>
          <button type="button" class="add-button" data-action="add-item">新增一条</button>
        </aside>

        <section class="editor-panel" aria-label="内容编辑">
          <div class="editor-list" data-editor-list></div>
        </section>

        <section class="preview-panel" aria-label="实时预览">
          <div class="preview-frame">
            <section class="preview-section" data-preview-section="projects">
              <h2>项目区</h2>
              <div class="projects-grid admin-preview-projects" data-preview-projects></div>
            </section>
            <section class="preview-section compact-preview" data-preview-section="todos">
              <h2>施工中</h2>
              <div class="todo-list" data-preview-todos></div>
            </section>
            <section class="preview-section compact-preview" data-preview-section="thoughts">
              <h2>怪念头</h2>
              <div class="admin-thought-preview" data-preview-thoughts></div>
            </section>
            <section class="preview-section compact-preview" data-preview-section="channels">
              <h2>自媒体</h2>
              <nav class="social-list" data-preview-channels></nav>
            </section>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
