<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>鸦珉.icu</title>
    <meta name="description" content="一张不太正经的项目地图。" />
    <link rel="canonical" href="/" />
    <link rel="stylesheet" href="/v1/styles.css?v=1.5-mobile-layout" />
    <script type="module" src="/v1/scripts/render-site.mjs?v=1.5-mobile-layout"></script>
    <script nomodule>
      window.location.replace("/v1/");
    </script>
    <script data-module-fallback>
      window.setTimeout(function () {
        var projects = document.querySelector("[data-projects]");
        if (projects && !projects.children.length) {
          window.location.replace("/v1/");
        }
      }, 1800);
    </script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div class="load-progress" data-load-progress data-load-state="boot" aria-hidden="true">
      <span></span>
    </div>
    <main class="page">
      <div class="map-viewport" data-map-viewport>
      <section class="map-frame" aria-label="鸦珉个人主页项目地图">
        <section class="panel panel-projects" aria-labelledby="projects-title">
          <header class="section-title">
            <span class="title-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 2.8 20 7v9.7l-8 4.5-8-4.5V7l8-4.2Z" />
                <path d="M4.5 7.3 12 11.5l7.5-4.2" />
                <path d="M12 11.5v8.7" />
              </svg>
            </span>
            <span id="projects-title">项目区</span>
          </header>

          <div class="projects-grid" data-projects></div>
        </section>

        <aside class="panel panel-todos" aria-labelledby="todos-title">
          <header class="section-title section-title-small">
            <span class="title-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M8 6h12M8 12h12M8 18h12" />
                <path d="M4 6h.01M4 12h.01M4 18h.01" />
              </svg>
            </span>
            <span id="todos-title">施工中</span>
          </header>

          <div class="todo-list" data-todos></div>
        </aside>

        <section class="panel panel-thoughts" aria-labelledby="thoughts-title">
          <header class="section-title section-title-small">
            <span class="title-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M9 18h6" />
                <path d="M10 22h4" />
                <path d="M8.2 15.2a6 6 0 1 1 7.6 0c-.9.7-1.3 1.4-1.3 2.3h-5c0-.9-.4-1.6-1.3-2.3Z" />
              </svg>
            </span>
            <span id="thoughts-title">怪念头</span>
          </header>

          <p class="site-signature">
            <span data-signature-title>鸦珉.icu</span>
            <small data-signature-subtitle>一张不太正经的项目地图</small>
          </p>

          <div class="thought-space" data-thoughts></div>
        </section>

        <aside class="panel panel-social" aria-label="自媒体与视频账号">
          <header class="section-title section-title-small visually-hidden">
            <span class="title-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M10 13a5 5 0 0 0 7.1 0l2.1-2.1a5 5 0 1 0-7.1-7.1L10.8 5" />
                <path d="M14 11a5 5 0 0 0-7.1 0l-2.1 2.1a5 5 0 1 0 7.1 7.1l1.3-1.2" />
              </svg>
            </span>
            <span id="social-title">自媒体</span>
          </header>

          <nav class="social-list" aria-label="公开视频账号" data-channels></nav>
        </aside>
      </section>
      </div>
    </main>
  </body>
</html>
